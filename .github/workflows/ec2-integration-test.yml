name: Reusable EC2 Integration Test

env:
  PRIVATE_KEY: ${{ secrets.AWS_PRIVATE_KEY  }}
  KEY_NAME: ${{ secrets.KEY_NAME }}
  TERRAFORM_AWS_ASSUME_ROLE_DURATION: 14400 # 4 hours

on:
  workflow_call:
    inputs:
      build_id:
        required: true
        type: string
      test_repo_name:
        required: true
        type: string
      test_repo_url:
        required: true
        type: string
      test_repo_branch:
        required: true
        type: string
      test_dir:
        required: true
        type: string
      job_id:
        required: true
        type: string
      test_props:
        required: true
        type: string
      localstack_host:
        type: string
      region:
        type: string
      terraform_assume_role:
        type: string
      is_selinux_test:
        type: boolean
      is_onprem_test:
        type: boolean
      s3_integration_bucket:
        type: string
    secrets:
      AWS_PRIVATE_KEY:
        required: false
      KEY_NAME:
        required: false

jobs:
  EC2IntegrationTest:
    name: ${{ matrix.arrays.pairName }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arrays: ${{ fromJson(inputs.test_props) }}
    env:
      PAIR_WORK_ROOT: ${{ github.workspace }}/ec2-integration-pair-work
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          path: cloudwatch-agent
          sparse-checkout: |
            .github/scripts

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          repository: ${{inputs.test_repo_name}}
          ref: ${{inputs.test_repo_branch}}
          path: integration-test-repo

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ inputs.terraform_assume_role }}
          aws-region: ${{inputs.region}}
          role-duration-seconds: ${{ env.TERRAFORM_AWS_ASSUME_ROLE_DURATION }}

      - name: Echo Test Info
        env:
          PAIR_JSON: ${{ toJson(matrix.arrays) }}
          INPUT_LOCALSTACK_HOST: ${{ inputs.localstack_host }}
        run: |
          python3 -c 'import json, os; print("paired cases:", ", ".join(case["testName"] for case in json.loads(os.environ["PAIR_JSON"])["cases"]))'
          echo "localstack input $INPUT_LOCALSTACK_HOST"

      - name: Install Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_wrapper: false

      - name: Verify Terraform version
        run: terraform --version

      - name: Run paired Terraform integration tests
        id: terraform_apply
        timeout-minutes: 70
        env:
          PAIR_JSON: ${{ toJson(matrix.arrays) }}
          INPUT_TEST_DIR: ${{ inputs.test_dir }}
          INPUT_BUILD_ID: ${{ inputs.build_id }}
          INPUT_TEST_REPO_URL: ${{ inputs.test_repo_url }}
          INPUT_TEST_REPO_BRANCH: ${{ inputs.test_repo_branch }}
          INPUT_IS_SELINUX_TEST: ${{ inputs.is_selinux_test }}
          INPUT_LOCALSTACK_HOST: ${{ inputs.localstack_host }}
          INPUT_PLUGINS: ${{ github.event.inputs.plugins }}
          INPUT_REGION: ${{ inputs.region }}
          INPUT_S3_BUCKET: ${{ inputs.s3_integration_bucket }}
          INPUT_IS_ONPREM_TEST: ${{ inputs.is_onprem_test }}
          PAIR_LAUNCH_DELAY_SECONDS: 5
        run: |
          python3 cloudwatch-agent/.github/scripts/run-ec2-integration-pair.py \
            --pair-json "$PAIR_JSON" \
            --source-dir integration-test-repo \
            --work-root "$PAIR_WORK_ROOT" \
            --default-terraform-dir "$INPUT_TEST_DIR"

      # This is here just in case the main step fails or the workflow is cancelled.
      - name: Terraform destroy
        if: ${{ cancelled() || failure() }}
        timeout-minutes: 20
        env:
          PAIR_JSON: ${{ toJson(matrix.arrays) }}
          INPUT_TEST_DIR: ${{ inputs.test_dir }}
          INPUT_REGION: ${{ inputs.region }}
          INPUT_IS_SELINUX_TEST: ${{ inputs.is_selinux_test }}
          INPUT_IS_ONPREM_TEST: ${{ inputs.is_onprem_test }}
        run: |
          python3 cloudwatch-agent/.github/scripts/run-ec2-integration-pair.py \
            --mode cleanup \
            --pair-json "$PAIR_JSON" \
            --source-dir integration-test-repo \
            --work-root "$PAIR_WORK_ROOT" \
            --default-terraform-dir "$INPUT_TEST_DIR"

      - name: Upload failed test logs
        if: ${{ cancelled() || failure() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ec2-integration-${{ inputs.job_id }}-${{ matrix.arrays.pairId }}
          path: |
            ${{ env.PAIR_WORK_ROOT }}/logs
            ${{ env.PAIR_WORK_ROOT }}/*-results.json
          if-no-files-found: ignore
