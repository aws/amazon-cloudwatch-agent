# Valid: the vLLM engine startup log line, for example
# "Initializing a V1 LLM engine (v0.11.0) with config: model='...', tensor_parallel_size=4, ..."
signal_to_info_metric/vllm:
  storage: file_storage/state
  emit_interval: 30s
  rules:
    - name: vllm_engine_config_info
      description: vLLM engine configuration from the engine startup log line.
      # vllm_version needs the full startup phrase and ") with config: ", so a line with only the phrase gives no series.
      # There is no prefix check, because vLLM writes "(EngineCore pid=N) INFO ..." or "INFO ..." first.
      body_contains:
        - "Initializing an LLM engine (v"
        - "Initializing a V0 LLM engine (v"
        - "Initializing a V1 LLM engine (v"
      identity: [k8s.namespace.name, k8s.pod.name, k8s.container.name]
      # The pod UID is included, so that the pipeline can compare it with the live pod.
      include_resource_attributes: [k8s.namespace.name, k8s.pod.name, k8s.container.name, k8s.pod.uid]
      attributes:
        - key: vllm_version
          value: 'ExtractPatterns(log.body, "Initializing an? (?:V[01] )?LLM engine \\(v(?P<v>[^)]+)\\) with config: ")["v"]'
        # A missing key in ExtractPatterns is an evaluation error, so the default applies to "Initializing an LLM engine" (v0.6.x) lines.
        - key: vllm_engine
          value: 'ExtractPatterns(log.body, "Initializing a (?P<v>V[01]) LLM engine")["v"]'
          default_value: V0
        - key: tensor_parallel_size
          value: 'ExtractPatterns(log.body, ", tensor_parallel_size=(?P<v>\\d+),")["v"]'
          optional: true

# Valid: a minimal rule that matches with conditions only, keeps every
# default, and uses the short "body" path style. The &base_rule anchor is
# reused by the cases below, each of which overrides fields with a YAML merge key.
signal_to_info_metric/minimal:
  rules:
    - &base_rule
      name: example_info
      conditions:
        - 'body == "service started"'
      identity: [k8s.pod.uid]
      include_resource_attributes: [k8s.pod.uid, k8s.pod.name]
      attributes:
        - key: version

# Valid: a rule that matches with body_contains only.
signal_to_info_metric/body_contains_only:
  rules:
    - <<: *base_rule
      body_contains: ["service started"]
      conditions: []

# Valid: every bound at its limit.
signal_to_info_metric/limits:
  emit_interval: 1s
  emit_on_change: false
  max_state_bytes: 67108864
  max_value_length: 1024
  error_mode: propagate
  rules:
    - <<: *base_rule
      name: nnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnn
      emit_interval: 24h
      max_entities: 100000
      max_attributes: 128
    - <<: *base_rule
      name: lower_limits_info
      max_entities: 1
      max_attributes: 1

# Invalid: connector settings.
signal_to_info_metric/no_rules:
  rules: []
signal_to_info_metric/emit_interval_too_small:
  emit_interval: 999ms
  rules: [*base_rule]
signal_to_info_metric/emit_interval_too_large:
  emit_interval: 24h1s
  rules: [*base_rule]
signal_to_info_metric/emit_interval_negative:
  emit_interval: -1s
  rules: [*base_rule]
signal_to_info_metric/max_state_bytes_too_small:
  max_state_bytes: 65535
  rules: [*base_rule]
signal_to_info_metric/max_state_bytes_too_large:
  max_state_bytes: 67108865
  rules: [*base_rule]
signal_to_info_metric/max_value_length_zero:
  max_value_length: 0
  rules: [*base_rule]
signal_to_info_metric/max_value_length_too_large:
  max_value_length: 1025
  rules: [*base_rule]
signal_to_info_metric/invalid_error_mode:
  error_mode: explode
  rules: [*base_rule]

# Invalid: rule name.
signal_to_info_metric/empty_rule_name:
  rules:
    - <<: *base_rule
      name: ""
signal_to_info_metric/long_rule_name:
  rules:
    - <<: *base_rule
      name: nnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnn
signal_to_info_metric/duplicate_rule_name:
  rules: [*base_rule, *base_rule]

# Invalid: matching.
signal_to_info_metric/no_body_contains_or_conditions:
  rules:
    - <<: *base_rule
      conditions: []
signal_to_info_metric/invalid_condition:
  rules:
    - <<: *base_rule
      conditions:
        - 'body == "service started"'
        - 'IsMatch(body, '
        - 'NoSuchConverter(body)'
signal_to_info_metric/empty_body_contains:
  rules:
    - <<: *base_rule
      body_contains: ["service", ""]

# Invalid: identity and resource attributes.
signal_to_info_metric/no_identity:
  rules:
    - <<: *base_rule
      identity: []
signal_to_info_metric/empty_identity_key:
  rules:
    - <<: *base_rule
      identity: [k8s.pod.uid, ""]
signal_to_info_metric/duplicate_identity_key:
  rules:
    - <<: *base_rule
      identity: [k8s.pod.uid, k8s.pod.uid]
signal_to_info_metric/identity_not_included:
  rules:
    - <<: *base_rule
      include_resource_attributes: [k8s.pod.name]
signal_to_info_metric/empty_include_key:
  rules:
    - <<: *base_rule
      include_resource_attributes: [k8s.pod.uid, ""]
signal_to_info_metric/duplicate_include_key:
  rules:
    - <<: *base_rule
      include_resource_attributes: [k8s.pod.uid, k8s.pod.name, k8s.pod.name]

# Invalid: attributes.
signal_to_info_metric/no_attributes:
  rules:
    - <<: *base_rule
      attributes: []
signal_to_info_metric/empty_attribute_key:
  rules:
    - <<: *base_rule
      attributes:
        - key: ""
signal_to_info_metric/duplicate_attribute_key:
  rules:
    - <<: *base_rule
      attributes:
        - key: version
        - key: version
          value: 'log.attributes["v"]'
signal_to_info_metric/invalid_attribute_value:
  rules:
    - <<: *base_rule
      attributes:
        - key: version
          value: 'ExtractPatterns(body, "(?P<v>[0-9")["v"]'
        - key: engine
          value: 'log.no_such_field'
signal_to_info_metric/optional_with_default_value:
  rules:
    - <<: *base_rule
      attributes:
        - key: version
          default_value: unknown
          optional: true
signal_to_info_metric/default_value_too_long:
  max_value_length: 2
  rules:
    - <<: *base_rule
      attributes:
        - key: version
          default_value: abc
signal_to_info_metric/too_many_attributes:
  rules:
    - <<: *base_rule
      max_attributes: 1
      attributes:
        - key: version
        - key: engine

# Invalid: rule bounds.
signal_to_info_metric/rule_emit_interval_negative:
  rules:
    - <<: *base_rule
      emit_interval: -1s
signal_to_info_metric/rule_emit_interval_too_small:
  rules:
    - <<: *base_rule
      emit_interval: 500ms
signal_to_info_metric/rule_emit_interval_too_large:
  rules:
    - <<: *base_rule
      emit_interval: 25h
signal_to_info_metric/max_entities_negative:
  rules:
    - <<: *base_rule
      max_entities: -1
signal_to_info_metric/max_entities_too_large:
  rules:
    - <<: *base_rule
      max_entities: 100001
signal_to_info_metric/max_attributes_negative:
  rules:
    - <<: *base_rule
      max_attributes: -1
signal_to_info_metric/max_attributes_too_large:
  rules:
    - <<: *base_rule
      max_attributes: 129

# Invalid: several problems at once; all of them must be reported.
signal_to_info_metric/multiple_errors:
  max_value_length: 2048
  rules:
    - <<: *base_rule
      name: ""
      conditions: []
      attributes: []
    - <<: *base_rule
      identity: []
