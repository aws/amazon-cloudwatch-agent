exporters:
    awscloudwatch:
        backoff_retry_base: 200ms
        force_flush_interval: 1m0s
        max_concurrent_publishers: 10
        max_datums_per_call: 1000
        max_retry_count: 5
        max_values_per_datum: 150
        middleware: agenthealth/metrics
        namespace: CWAgent
        region: us-west-2
        resource_to_telemetry_conversion:
            enabled: true
            exclude_service_attributes: false
    prometheus_remote_write/amp:
        add_metric_suffixes: false
        convert_explicit_histograms_to_nhcb: false
        disable_scope_info: true
        http:
            auth:
                authenticator: sigv4auth
            endpoint: https://aps-workspaces.us-west-2.amazonaws.com/workspaces/ws-12345/api/v1/remote_write
            force_attempt_http2: true
            keepalive:
                idle_conn_timeout: 1m30s
                max_idle_conns: 100
            timeout: 5s
            write_buffer_size: 524288
        keep_classic_histograms: false
        max_batch_size_bytes: 3000000
        namespace: ""
        protobuf_message: prometheus.WriteRequest
        remote_write_queue:
            enabled: true
            num_consumers: 5
            queue_size: 10000
        resource_constant_labels:
            enabled: false
            exclude_service_attributes: false
        resource_to_telemetry_conversion:
            clear_after_copy: true
            enabled: true
            exclude_service_attributes: false
        retry_on_failure:
            enabled: true
            initial_interval: 50ms
            max_elapsed_time: 5m0s
            max_interval: 30s
            multiplier: 1.5
            randomization_factor: 0.5
        send_metadata: false
        target_info:
            enabled: true
        timeout: 5s
        translation_strategy: ""
extensions:
    agenthealth/metrics:
        is_status_code_enabled: true
        is_usage_data_enabled: true
        stats:
            operations:
                - PutMetricData
            usage_flags:
                mode: EC2
                region_type: ACJ
    entitystore:
        mode: ec2
        region: us-west-2
    sigv4auth:
        assume_role: {}
        imds_retries: 1
        max_retries: 2
        num_workers: 8
        region: us-west-2
        request_timeout_seconds: 30
processors:
    batch/jmx/amp/0:
        metadata_cardinality_limit: 1000
        send_batch_max_size: 0
        send_batch_size: 8192
        timeout: 1m0s
    batch/jmx/amp/1:
        metadata_cardinality_limit: 1000
        send_batch_max_size: 0
        send_batch_size: 8192
        timeout: 1m0s
    cumulative_to_delta/jmx:
        exclude:
            match_type: ""
        include:
            match_type: ""
        initial_value: 2
        max_staleness: 1h0m0s
    delta_to_cumulative/jmx/amp/0:
        max_stale: 336h0m0s
        max_streams: 9223372036854775807
    delta_to_cumulative/jmx/amp/1:
        max_stale: 336h0m0s
        max_streams: 9223372036854775807
    filter/jmx/0:
        error_mode: ignore
        logs: {}
        metrics:
            include:
                match_type: strict
                metric_names:
                    - jvm.memory.heap.init
                    - jvm.memory.heap.used
                    - jvm.memory.nonheap.init
        profiles: {}
        spans: {}
        traces: {}
    filter/jmx/1:
        error_mode: ignore
        logs: {}
        metrics:
            include:
                match_type: strict
                metric_names:
                    - kafka.consumer.fetch-rate
        profiles: {}
        spans: {}
        traces: {}
    metrics_transform/jmx:
        transforms:
            - action: update
              aggregation_type: ""
              include: tomcat.sessions
              match_type: ""
              new_name: ""
              operations:
                - action: aggregate_labels
                  aggregation_type: sum
                  experimental_scale: 0
                  label: ""
                  label_value: ""
                  new_label: ""
                  new_value: ""
                - action: delete_label_value
                  aggregation_type: ""
                  experimental_scale: 0
                  label: context
                  label_value: ""
                  new_label: ""
                  new_value: ""
              submatch_case: ""
            - action: update
              aggregation_type: ""
              include: tomcat.rejected_sessions
              match_type: ""
              new_name: ""
              operations:
                - action: aggregate_labels
                  aggregation_type: sum
                  experimental_scale: 0
                  label: ""
                  label_value: ""
                  new_label: ""
                  new_value: ""
                - action: delete_label_value
                  aggregation_type: ""
                  experimental_scale: 0
                  label: context
                  label_value: ""
                  new_label: ""
                  new_value: ""
              submatch_case: ""
    resource/jmx/0:
        attributes:
            - action: upsert
              converted_type: ""
              from_attribute: ""
              from_context: ""
              key: k1
              pattern: ""
              value: v1
    resource/jmx/1:
        attributes:
            - action: upsert
              converted_type: ""
              from_attribute: ""
              from_context: ""
              key: k2
              pattern: ""
              value: v2
    transform/jmx/0:
        error_mode: ignore
        flatten:
            log: false
        log_statements: []
        metric_statements:
            - context: metric
              error_mode: propagate
              shared_cache: false
              statements:
                - set(unit, "unit") where name == "jvm.memory.heap.used"
                - set(name, "JVM_MEM_HEAP_USED") where name == "jvm.memory.heap.used"
        profile_statements: []
        trace_statements: []
    transform/jmx/1:
        error_mode: ignore
        flatten:
            log: false
        log_statements: []
        metric_statements:
            - context: metric
              error_mode: propagate
              shared_cache: false
              statements:
                - set(name, "kafka.fetch-rate") where name == "kafka.consumer.fetch-rate"
        profile_statements: []
        trace_statements: []
    transform/jmx/drop:
        error_mode: ignore
        flatten:
            log: false
        log_statements: []
        metric_statements:
            - context: resource
              error_mode: propagate
              shared_cache: false
              statements:
                - delete_matching_keys(attributes, "^cloud.*")
                - delete_matching_keys(attributes, "^host.*")
                - delete_matching_keys(attributes, "^os.*")
                - delete_matching_keys(attributes, "^container.*")
                - delete_matching_keys(attributes, "^process.*")
                - delete_matching_keys(attributes, "^service.*")
                - delete_matching_keys(attributes, "^telemetry.*")
        profile_statements: []
        trace_statements: []
receivers:
    otlp/http_0_0_0_0_4314:
        protocols:
            http:
                endpoint: 0.0.0.0:4314
                keepalive:
                    idle_timeout: 1m0s
                logs_url_path: /v1/logs
                metrics_url_path: /v1/metrics
                read_header_timeout: 0s
                traces_url_path: /v1/traces
                transport: tcp
                write_timeout: 0s
service:
    extensions:
        - agenthealth/metrics
        - sigv4auth
        - entitystore
    pipelines:
        metrics/jmx/amp/0:
            exporters:
                - prometheus_remote_write/amp
            processors:
                - filter/jmx/0
                - metrics_transform/jmx
                - resource/jmx/0
                - transform/jmx/drop
                - transform/jmx/0
                - batch/jmx/amp/0
                - delta_to_cumulative/jmx/amp/0
            receivers:
                - otlp/http_0_0_0_0_4314
        metrics/jmx/amp/1:
            exporters:
                - prometheus_remote_write/amp
            processors:
                - filter/jmx/1
                - metrics_transform/jmx
                - resource/jmx/1
                - transform/jmx/drop
                - transform/jmx/1
                - batch/jmx/amp/1
                - delta_to_cumulative/jmx/amp/1
            receivers:
                - otlp/http_0_0_0_0_4314
        metrics/jmx/cloudwatch/0:
            exporters:
                - awscloudwatch
            processors:
                - filter/jmx/0
                - metrics_transform/jmx
                - resource/jmx/0
                - transform/jmx/drop
                - transform/jmx/0
                - cumulative_to_delta/jmx
            receivers:
                - otlp/http_0_0_0_0_4314
        metrics/jmx/cloudwatch/1:
            exporters:
                - awscloudwatch
            processors:
                - filter/jmx/1
                - metrics_transform/jmx
                - resource/jmx/1
                - transform/jmx/drop
                - transform/jmx/1
                - cumulative_to_delta/jmx
            receivers:
                - otlp/http_0_0_0_0_4314
    telemetry:
        logs:
            encoding: console
            error_output_paths: null
            level: info
            output_paths: null
            sampling:
                enabled: true
                initial: 2
                thereafter: 500
                tick: 10s
        metrics:
            level: None
        traces:
            level: None
            propagators: null
