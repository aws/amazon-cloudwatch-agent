exporters:
    awscloudwatch:
        backoff_retry_base: 200ms
        force_flush_interval: 1m0s
        max_concurrent_publishers: 10
        max_datums_per_call: 1000
        max_retry_count: 5
        max_values_per_datum: 150
        middleware: agenthealth/metrics
        namespace: CWAgent
        profile: default
        region: us-east-1
        resource_to_telemetry_conversion:
            enabled: true
            exclude_service_attributes: false
        shared_credential_file: /root/.aws/credentials
    awsxray:
        imds_retries: 2
        index_all_attributes: false
        max_retries: 2
        middleware: agenthealth/traces
        num_workers: 8
        profile: default
        region: us-east-1
        request_timeout_seconds: 30
        shared_credentials_file:
            - /root/.aws/credentials
        telemetry:
            enabled: true
            include_metadata: true
    otlp_http/profiles:
        auth:
            authenticator: agenthealth/profiles
        compression: gzip
        encoding: proto
        force_attempt_http2: true
        idle_conn_timeout: 1m30s
        logs_endpoint: ""
        max_idle_conns: 100
        metrics_endpoint: ""
        profiles_endpoint: https://monitoring.us-east-1.amazonaws.com/v1development/profiles
        retry_on_failure:
            enabled: true
            initial_interval: 5s
            max_elapsed_time: 5m0s
            max_interval: 30s
            multiplier: 1.5
            randomization_factor: 0.5
        sending_queue:
            batch: null
            block_on_overflow: false
            num_consumers: 10
            queue_size: 1000
            sizer: null
            storage: null
            wait_for_result: false
        timeout: 30s
        traces_endpoint: ""
        write_buffer_size: 524288
extensions:
    agenthealth/metrics:
        is_usage_data_enabled: true
        stats:
            operations:
                - PutMetricData
            usage_flags:
                mode: EC2
                region_type: ACJ
    agenthealth/profiles:
        additional_auth: sigv4auth/monitoring
        is_usage_data_enabled: true
        stats:
            operations:
                - '*'
            usage_flags:
                mode: EC2
                region_type: ACJ
    agenthealth/statuscode:
        is_status_code_enabled: true
        is_usage_data_enabled: true
        stats:
            usage_flags:
                mode: EC2
                region_type: ACJ
    agenthealth/traces:
        is_usage_data_enabled: true
        stats:
            operations:
                - PutTraceSegments
            usage_flags:
                mode: EC2
                region_type: ACJ
    entitystore:
        mode: ec2
        profile: default
        region: us-east-1
        shared_credential_file: /root/.aws/credentials
    sigv4auth/monitoring:
        assume_role: {}
        imds_retries: 2
        max_retries: 2
        num_workers: 8
        profile: default
        region: us-east-1
        request_timeout_seconds: 30
        service: monitoring
        shared_credentials_file:
            - /root/.aws/credentials
processors:
    awsentity/resource:
        entity_type: Resource
        platform: ec2
    batch/xray:
        metadata_cardinality_limit: 1000
        send_batch_max_size: 0
        send_batch_size: 8192
        timeout: 200ms
    resource/profiles:
        attributes:
            - action: upsert
              converted_type: ""
              from_attribute: ""
              from_context: ""
              key: service.name
              pattern: ""
              value: my-service
receivers:
    otlp/grpc_127_0_0_1_4317:
        protocols:
            grpc:
                endpoint: 127.0.0.1:4317
                keepalive:
                    enforcement_policy: null
                    server_parameters: null
                read_buffer_size: 524288
                transport: tcp
    otlp/http_127_0_0_1_4318:
        protocols:
            http:
                cors: null
                endpoint: 127.0.0.1:4318
                idle_timeout: 0s
                keep_alives_enabled: true
                logs_url_path: /v1/logs
                metrics_url_path: /v1/metrics
                read_header_timeout: 0s
                tls: null
                traces_url_path: /v1/traces
                transport: tcp
                write_timeout: 0s
    telegraf_cpu:
        collection_interval: 1m0s
        initial_delay: 1s
        timeout: 0s
service:
    extensions:
        - agenthealth/metrics
        - agenthealth/statuscode
        - agenthealth/traces
        - sigv4auth/monitoring
        - agenthealth/profiles
        - entitystore
    pipelines:
        metrics/host:
            exporters:
                - awscloudwatch
            processors:
                - awsentity/resource
            receivers:
                - telegraf_cpu
        profiles/profiles:
            exporters:
                - otlp_http/profiles
            processors:
                - resource/profiles
            receivers:
                - otlp/http_127_0_0_1_4318
        traces/xray:
            exporters:
                - awsxray
            processors:
                - batch/xray
            receivers:
                - otlp/grpc_127_0_0_1_4317
                - otlp/http_127_0_0_1_4318
    telemetry:
        logs:
            encoding: console
            error_output_paths: null
            level: info
            output_paths:
                - /opt/aws/amazon-cloudwatch-agent/logs/amazon-cloudwatch-agent.log
            sampling:
                enabled: true
                initial: 2
                thereafter: 500
                tick: 10s
        metrics:
            level: None
        traces:
            level: None
            propagators: null
