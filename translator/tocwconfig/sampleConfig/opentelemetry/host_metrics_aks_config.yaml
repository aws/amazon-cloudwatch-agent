                    system.cpu.physical.count:
                        enabled: true
                    system.cpu.utilization:
                        enabled: true
            disk: null
            filesystem:
                metrics:
                    system.filesystem.utilization:
                        enabled: true
            load: null
            memory:
                metrics:
                    system.linux.memory.available:
                        enabled: true
                    system.linux.memory.dirty:
                        enabled: true
                    system.memory.limit:
                        enabled: true
                    system.memory.page_size:
                        enabled: true
                    system.memory.utilization:
                        enabled: true
            network: null
            processes: null
        timeout: 0s
service:
