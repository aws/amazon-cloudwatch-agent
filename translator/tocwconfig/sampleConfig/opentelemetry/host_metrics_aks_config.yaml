        - server
    pipelines:
        metrics/host_metrics:
            exporters:
                - forward/opentelemetry
            processors:
                - transform/host_metrics_scope
            receivers:
                - hostmetrics/opentelemetry
        metrics/opentelemetry:
            exporters:
                - otlp_http/metrics
            processors:
                - resourcedetection/opentelemetry
                - k8s_attributes/opentelemetry
                - transform/set_cluster_name
                - transform/identity
                - awsattributelimit/opentelemetry_metrics
                - batch/opentelemetry_metrics
            receivers:
                - forward/opentelemetry
    telemetry:
        logs:
            encoding: console
            error_output_paths: null
            level: info
            output_paths: null
            sampling:
                enabled: true
                initial: 2
                thereafter: 500
                tick: 10s
        metrics:
            level: None
        traces:
            level: None
            propagators: null
