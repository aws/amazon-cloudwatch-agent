connectors:
    forward/opentelemetry: {}
exporters:
    otlp_http/metrics:
        auth:
            authenticator: agenthealth/opentelemetry_metrics
        compression: gzip
        encoding: proto
        force_attempt_http2: true
        idle_conn_timeout: 1m30s
        logs_endpoint: ""
        max_idle_conns: 100
        metrics_endpoint: https://monitoring.us-west-2.amazonaws.com/v1/metrics
        profiles_endpoint: ""
        retry_on_failure:
            enabled: true
            initial_interval: 5s
            max_elapsed_time: 5m0s
            max_interval: 30s
            multiplier: 1.5
            randomization_factor: 0.5
        sending_queue:
            batch: null
            block_on_overflow: false
            num_consumers: 10
            queue_size: 1000
            sizer: null
            storage: null
            wait_for_result: false
        timeout: 30s
        traces_endpoint: ""
        write_buffer_size: 524288
extensions:
    agenthealth/opentelemetry_metrics:
        additional_auth: sigv4auth/monitoring
        is_usage_data_enabled: true
        stats:
            operations:
                - '*'
            usage_flags:
                mode: AKS
                region_type: ACJ
    server:
        listen_addr: :4311
        tls_ca_path: /etc/amazon-cloudwatch-observability-agent-client-cert/tls-ca.crt
        tls_cert_path: /etc/amazon-cloudwatch-observability-agent-server-cert/server.crt
        tls_key_path: /etc/amazon-cloudwatch-observability-agent-server-cert/server.key
    sigv4auth/monitoring:
        assume_role: {}
        imds_retries: 1
        max_retries: 2
        num_workers: 8
        region: us-west-2
        request_timeout_seconds: 30
        service: monitoring
processors:
    awsattributelimit/opentelemetry_metrics:
        max_total_attributes: 150
    batch/opentelemetry_metrics:
        metadata_cardinality_limit: 1000
        send_batch_max_size: 1000
        send_batch_size: 1000
        timeout: 10s
    k8s_attributes/opentelemetry:
        auth_type: serviceAccount
        context: ""
        exclude:
            pods: []
        extract:
            annotations:
                - from: pod
                  key: resource.opentelemetry.io/service.name
                  key_regex: ""
                  tag_name: resource.opentelemetry.io/service.name
                - from: pod
                  key: resource.opentelemetry.io/service.namespace
                  key_regex: ""
                  tag_name: resource.opentelemetry.io/service.namespace
                - from: pod
                  key: resource.opentelemetry.io/service.instance.id
                  key_regex: ""
                  tag_name: resource.opentelemetry.io/service.instance.id
                - from: pod
                  key: resource.opentelemetry.io/service.version
                  key_regex: ""
                  tag_name: resource.opentelemetry.io/service.version
            deployment_name_from_replicaset: false
            labels:
                - from: pod
                  key: app.kubernetes.io/instance
                  key_regex: ""
                  tag_name: app.kubernetes.io/instance
                - from: pod
                  key: app.kubernetes.io/name
                  key_regex: ""
                  tag_name: app.kubernetes.io/name
                - from: pod
                  key: app.kubernetes.io/version
                  key_regex: ""
                  tag_name: app.kubernetes.io/version
            metadata:
                - k8s.namespace.name
                - k8s.deployment.name
                - k8s.replicaset.name
                - k8s.statefulset.name
                - k8s.daemonset.name
                - k8s.job.name
                - k8s.cronjob.name
                - k8s.node.name
                - k8s.pod.name
                - k8s.pod.uid
                - k8s.pod.start_time
                - k8s.container.name
            otel_annotations: false
        filter:
            namespace: ""
            node: ""
            node_from_env_var: K8S_NODE_NAME
        kube_api_burst: 0
        kube_api_qps: 0
        kube_config_path: ""
        passthrough: false
        wait_for_metadata: false
        wait_for_metadata_timeout: 10s
    resourcedetection/opentelemetry:
        akamai:
            resource_attributes:
                cloud.account.id:
                    enabled: true
                cloud.platform:
                    enabled: true
                cloud.provider:
                    enabled: true
                cloud.region:
                    enabled: true
                host.id:
                    enabled: true
                host.image.id:
                    enabled: true
                host.image.name:
                    enabled: true
                host.name:
                    enabled: true
                host.type:
                    enabled: true
        aks:
            resource_attributes:
                cloud.platform:
                    enabled: true
                cloud.provider:
                    enabled: true
                k8s.cluster.name:
                    enabled: false
        alibaba_ecs:
            fail_on_missing_metadata: false
            resource_attributes:
                cloud.account.id:
                    enabled: true
                cloud.availability_zone:
                    enabled: true
