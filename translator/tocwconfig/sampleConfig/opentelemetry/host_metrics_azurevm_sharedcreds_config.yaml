connectors:
    forward/opentelemetry: {}
exporters:
    otlp_http/metrics:
        auth:
            authenticator: agenthealth/opentelemetry_metrics
        compression: gzip
        encoding: proto
        force_attempt_http2: true
        keepalive:
            idle_conn_timeout: 1m30s
            max_idle_conns: 100
        logs_endpoint: ""
        metrics_endpoint: https://monitoring.us-west-2.amazonaws.com/v1/metrics
        profiles_endpoint: ""
        retry_on_failure:
            enabled: true
            initial_interval: 5s
            max_elapsed_time: 5m0s
            max_interval: 30s
            multiplier: 1.5
            randomization_factor: 0.5
        timeout: 30s
        traces_endpoint: ""
        write_buffer_size: 524288
extensions:
    agenthealth/opentelemetry_metrics:
        additional_auth: sigv4auth/monitoring
        is_usage_data_enabled: true
        stats:
            operations:
                - '*'
            usage_flags:
                mode: AZVM
                region_type: ACJ
    sigv4auth/monitoring:
        assume_role: {}
        imds_retries: 2
        max_retries: 2
        num_workers: 8
        profile: default
        region: us-west-2
        request_timeout_seconds: 30
        role_arn: arn:aws:iam::123456789012:role/AzureVMRole
        service: monitoring
        shared_credentials_file:
            - /root/.aws/credentials
processors:
    awsattributelimit/opentelemetry_metrics:
        max_total_attributes: 150
    batch/opentelemetry_metrics:
        metadata_cardinality_limit: 1000
        send_batch_max_size: 1000
        send_batch_size: 1000
        timeout: 10s
