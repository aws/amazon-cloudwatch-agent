                - set(resource.attributes["deployment.environment.name"], Concat([resource.attributes["cloud.platform"], resource.attributes["azure.resourcegroup.name"]], ":")) where resource.attributes["deployment.environment.name"] == nil and resource.attributes["azure.resourcegroup.name"] != nil
                - set(resource.attributes["deployment.environment.name"], Concat([resource.attributes["cloud.platform"], "default"], ":")) where resource.attributes["deployment.environment.name"] == nil and resource.attributes["cloud.platform"] != nil
        trace_statements:
            - context: resource
              error_mode: ignore
              shared_cache: false
              statements:
                - set(resource.attributes["service.name"], "unknown_service") where resource.attributes["service.name"] == nil
                - set(resource.attributes["cloud.resource_id"], Format("/subscriptions/%s/resourceGroups/%s/providers/Microsoft.Compute/virtualMachines/%s", [resource.attributes["cloud.account.id"], resource.attributes["azure.resourcegroup.name"], resource.attributes["azure.vm.name"]])) where resource.attributes["cloud.resource_id"] == nil and resource.attributes["azure.resourcegroup.name"] != nil and resource.attributes["azure.vm.name"] != nil
                - set(resource.attributes["deployment.environment.name"], Concat([resource.attributes["cloud.platform"], resource.attributes["azure.resourcegroup.name"]], ":")) where resource.attributes["deployment.environment.name"] == nil and resource.attributes["azure.resourcegroup.name"] != nil
                - set(resource.attributes["deployment.environment.name"], Concat([resource.attributes["cloud.platform"], "default"], ":")) where resource.attributes["deployment.environment.name"] == nil and resource.attributes["cloud.platform"] != nil
receivers:
    host_metrics/opentelemetry:
        collection_interval: 10s
        initial_delay: 1s
        scrapers:
            cpu:
                metrics:
                    system.cpu.frequency:
                        enabled: true
                    system.cpu.logical.count:
                        enabled: true
                    system.cpu.physical.count:
                        enabled: true
                    system.cpu.utilization:
                        enabled: true
            disk: null
            filesystem:
                metrics:
                    system.filesystem.utilization:
                        enabled: true
            load: null
            memory:
                metrics:
                    system.linux.memory.available:
                        enabled: true
                    system.linux.memory.dirty:
                        enabled: true
                    system.memory.limit:
                        enabled: true
                    system.memory.page_size:
                        enabled: true
                    system.memory.utilization:
                        enabled: true
            network: null
            processes: null
        timeout: 0s
service:
    extensions:
        - sigv4auth/monitoring
        - agenthealth/opentelemetry_metrics
    pipelines:
        metrics/host_metrics:
            exporters:
                - forward/opentelemetry
            processors:
                - transform/host_metrics_scope
            receivers:
                - host_metrics/opentelemetry
        metrics/opentelemetry:
            exporters:
                - otlp_http/metrics
            processors:
                - resource_detection/opentelemetry
                - transform/identity
                - awsattributelimit/opentelemetry_metrics
                - batch/opentelemetry_metrics
            receivers:
                - forward/opentelemetry
    telemetry:
        logs:
            encoding: console
            error_output_paths: null
            level: info
            output_paths:
                - /opt/aws/amazon-cloudwatch-agent/logs/amazon-cloudwatch-agent.log
            sampling:
                enabled: true
                initial: 2
                thereafter: 500
                tick: 10s
        metrics:
            level: None
        traces:
            level: None
            propagators: null
