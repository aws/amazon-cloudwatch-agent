exporters:
    awscloudwatch:
        backoff_retry_base: 200ms
        force_flush_interval: 1m0s
        max_concurrent_publishers: 10
        max_datums_per_call: 1000
        max_retry_count: 5
        max_values_per_datum: 150
        middleware: agenthealth/metrics
        namespace: CWAgent
        region: us-east-1
        resource_to_telemetry_conversion:
            enabled: true
extensions:
    agenthealth/metrics:
        is_usage_data_enabled: true
        stats:
            operations:
                - PutMetricData
            usage_flags:
                mode: ""
                region_type: ACJ
    agenthealth/statuscode:
        is_status_code_enabled: true
        is_usage_data_enabled: true
        stats:
            usage_flags:
                mode: ""
                region_type: ACJ
    entitystore:
        mode: ec2
        region: us-east-1
    selftelemetry: {}
processors:
    awsentity/resource:
        entity_type: Resource
        platform: ec2
receivers:
    telegraf_cpu:
        collection_interval: 1m0s
        initial_delay: 1s
        timeout: 0s
    telegraf_mem:
        collection_interval: 1m0s
        initial_delay: 1s
        timeout: 0s
service:
    extensions:
        - agenthealth/metrics
        - agenthealth/statuscode
        - entitystore
        - selftelemetry
    pipelines:
        metrics/host:
            exporters:
                - awscloudwatch
            processors:
                - awsentity/resource
            receivers:
                - telegraf_cpu
                - telegraf_mem
    telemetry:
        logs:
            encoding: console
            level: info
            output_paths:
                - /opt/aws/amazon-cloudwatch-agent/logs/amazon-cloudwatch-agent.log
            sampling:
                enabled: true
                initial: 2
                thereafter: 500
                tick: 10s
        metrics:
            level: Basic
            readers:
                - pull:
                    exporter:
                        prometheus:
                            host: 127.0.0.1
                            port: 28888
                            with_resource_constant_labels:
                                included:
                                    - NodeName
                            without_scope_info: true
                            without_type_suffix: true
                            without_units: true
        resource:
            NodeName: i-1234567890abcdef0
        traces:
            level: None
