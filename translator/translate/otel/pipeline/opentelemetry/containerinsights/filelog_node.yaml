receivers:
  filelog/cw_k8s_ci_v0_node:
    include:
    - /var/log/messages
    - /var/log/dmesg
    - /var/log/secure
    include_file_name: false
    include_file_path: true
    max_concurrent_files: 100
    start_at: end
processors:
  transform/cw_k8s_ci_v0_logs_set_cluster_and_node:
    error_mode: ignore
    log_statements:
    - context: resource
      statements:
      - set(attributes["k8s.cluster.name"], "{{.ClusterName}}")
      - set(attributes["k8s.node.name"], "{{.NodeName}}")
      - set(attributes["_tmp.log_type"], "host")
  resourcedetection/cw_k8s_ci_v0:
    detectors: [eks, env, ec2]
    override: false
    timeout: 2s
  transform/cw_k8s_ci_v0_logs_set_cloud_resource_id:
    error_mode: ignore
    log_statements:
    - context: resource
      statements:
      - set(attributes["cloud.resource_id"], Concat(["arn:aws:eks:", attributes["cloud.region"], ":", attributes["cloud.account.id"], ":cluster/", attributes["k8s.cluster.name"]], "")) where attributes["cloud.region"] != nil and attributes["cloud.account.id"] != nil and attributes["k8s.cluster.name"] != nil
  k8sattributes/cw_k8s_ci_v0_node:
    auth_type: serviceAccount
    extract:
      labels:
      - from: node
        key_regex: (.*)
        tag_name: k8s.node.label.$1
      metadata:
      - k8s.node.name
    filter:
      node_from_env_var: K8S_NODE_NAME
    passthrough: false
    exclude:
      pods: []
    pod_association:
    - sources:
      - from: resource_attribute
        name: k8s.node.name
  transform/cw_k8s_ci_v0_logs_set_scope_host:
    error_mode: ignore
    log_statements:
    - context: scope
      statements:
      - set(scope.schema_url, "")
      - set(attributes["cloudwatch.source"], "cloudwatch-agent")
      - set(attributes["cloudwatch.solution"], "k8s-otel-container-insights")
      - set(attributes["cloudwatch.pipeline"], "host-logs")
  # Sets the CI log group/stream directly; shared logs_routing is a no-op when already set.
  transform/cw_k8s_ci_v0_node_logs_set_log_destination:
    error_mode: ignore
    log_statements:
    - context: resource
      statements:
      - set(attributes["aws.log.group.name"], "{{.NodeLogGroup}}")
      - set(attributes["aws.log.stream.name"], "{{.NodeLogStream}}")
connectors:
  forward/opentelemetry: {}
service:
  pipelines:
    logs/cw_k8s_ci_v0_node:
      receivers:
      - filelog/cw_k8s_ci_v0_node
      processors:
      - transform/cw_k8s_ci_v0_logs_set_cluster_and_node
      - resourcedetection/cw_k8s_ci_v0
      - transform/cw_k8s_ci_v0_logs_set_cloud_resource_id
      - k8sattributes/cw_k8s_ci_v0_node
      - transform/cw_k8s_ci_v0_logs_set_scope_host
      - transform/cw_k8s_ci_v0_node_logs_set_log_destination
      exporters:
      - forward/opentelemetry
