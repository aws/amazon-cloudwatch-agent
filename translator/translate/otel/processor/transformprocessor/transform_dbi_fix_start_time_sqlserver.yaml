error_mode: ignore
metric_statements:
  - context: datapoint
    error_mode: ignore
    statements:
      - set(datapoint.start_time_unix_nano, datapoint.time_unix_nano) where datapoint.start_time_unix_nano == 0
      - replace_match(datapoint.attributes["sqlserver.wait_category"], "", "CPU")
      - replace_match(datapoint.attributes["network.peer.address"], "", "unknown")
      - replace_match(datapoint.attributes["sqlserver.query_hash"], "", "unknown")
      - replace_match(datapoint.attributes["user.name"], "", "unknown")
      - replace_match(datapoint.attributes["sqlserver.application.name"], "", "unknown")
