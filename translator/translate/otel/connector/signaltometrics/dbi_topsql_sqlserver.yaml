logs:
  - name: sqlserver.execution_count
    include_resource_attributes:
      - key: service.instance.id
    description: "Number of executions"
    attributes:
      - key: db.system.name
      - key: sqlserver.query_hash
      - key: sqlserver.query_plan_hash
      - key: db.namespace
    conditions:
      - attributes["sqlserver.execution_count"] != nil
    sum:
      value: 'Int(attributes["sqlserver.execution_count"])'
  - name: sqlserver.total_elapsed_time
    include_resource_attributes:
      - key: service.instance.id
    description: "Total elapsed time (seconds)"
    attributes:
      - key: db.system.name
      - key: sqlserver.query_hash
      - key: sqlserver.query_plan_hash
      - key: db.namespace
    conditions:
      - attributes["sqlserver.total_elapsed_time"] != nil
    sum:
      value: 'Double(attributes["sqlserver.total_elapsed_time"])'
