logs:
  sqlserver.active_sessions.by_app:
    description: "Active sessions by application"
    conditions:
      - attributes["sqlserver.session_status"] != "sleeping"
    attributes:
      - key: db.system.name
      - key: sqlserver.application.name
      - key: db.namespace
  sqlserver.active_sessions.by_wait:
    description: "Active sessions by wait category"
    conditions:
      - attributes["sqlserver.session_status"] != "sleeping"
    attributes:
      - key: db.system.name
      - key: sqlserver.wait_category
      - key: db.namespace
  sqlserver.active_sessions.by_user:
    description: "Active sessions by user"
    conditions:
      - attributes["sqlserver.session_status"] != "sleeping"
    attributes:
      - key: db.system.name
      - key: user.name
      - key: db.namespace
  sqlserver.active_sessions.by_db:
    description: "Active sessions by database"
    conditions:
      - attributes["sqlserver.session_status"] != "sleeping"
    attributes:
      - key: db.system.name
      - key: db.namespace
  sqlserver.active_sessions.by_sql:
    description: "Active sessions by query hash"
    conditions:
      - attributes["sqlserver.session_status"] != "sleeping"
    attributes:
      - key: db.system.name
      - key: sqlserver.query_hash
      - key: db.namespace
  sqlserver.active_sessions.by_sql_wait:
    description: "Active sessions by query and wait category"
    conditions:
      - attributes["sqlserver.session_status"] != "sleeping"
    attributes:
      - key: db.system.name
      - key: sqlserver.query_hash
      - key: sqlserver.wait_category
      - key: db.namespace
  sqlserver.active_sessions.by_host:
    description: "Active sessions by host"
    conditions:
      - attributes["sqlserver.session_status"] != "sleeping"
    attributes:
      - key: db.system.name
      - key: network.peer.address
      - key: db.namespace
  sqlserver.active_sessions.count:
    description: "Total active sessions"
    conditions:
      - attributes["sqlserver.session_status"] != "sleeping"
    attributes:
      - key: db.system.name
      - key: db.namespace
