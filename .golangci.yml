version: "2"
run:
  concurrency: 4
  modules-download-mode: readonly
  issues-exit-code: 1
  tests: true
output:
  formats:
    text:
      path: stdout
      print-linter-name: true
      print-issued-lines: true
linters:
  enable:
    - depguard
    - gosec
    - misspell
    - nonamedreturns
    - revive
  disable:
    - errcheck
  settings:
    depguard:
      rules:
        aws-sdk:
          deny:
            # Note the trailing slash: without it this also matches aws-sdk-go-v2.
            - pkg: github.com/aws/aws-sdk-go/
              desc: use aws-sdk-go-v2 for all AWS SDK usage.
            - pkg: github.com/amazon-contributing/opentelemetry-collector-contrib/override/aws/awsrulesfn
              desc: generated partition data; use the override/aws wrappers instead.
    misspell:
      ignore-rules:
        - performancetest
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    paths:
      - third_party$
      - builtin$
      - examples$
    rules:
      - linters:
        - revive
        path: 'translator/translate/util/*'
        text: 'var-naming: avoid meaningless package names'
      - linters:
        - revive
        path: 'translator/translate/otel/common/*'
        text: 'var-naming: avoid meaningless package names'
      - linters:
        - staticcheck
        text: 'ST1005: error strings should not be capitalized'
issues:
  new-from-rev: 98e058f9
formatters:
  enable:
    - gofmt
    - goimports
  settings:
    gofmt:
      simplify: true
    goimports:
      local-prefixes:
        - github.com/aws/amazon-cloudwatch-agent
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
